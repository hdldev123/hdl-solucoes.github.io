name: Caderno HDL — coleta de notícias

on:
  # O relógio principal é o agendador da Vercel (api/caderno/agendador.js + "schedules" no
  # vercel.json), que dispara este workflow via workflow_dispatch com agendado=true de hora
  # em hora, das 06h às 22h de Brasília. O cron abaixo fica só como reserva, porque o GitHub
  # pode atrasar ou descartar execuções agendadas (em 25-26/11/2026 não disparou nenhuma).
  # Disparos duplicados são inofensivos: o ritmo mínimo entre notícias (3h30) é controlado
  # por scripts/caderno/coletar.mjs e o "concurrency" abaixo serializa as rodadas.
  schedule:
    # UTC 09-23 = 06h-20h BRT; UTC 00 e 01 = 21h e 22h BRT.
    - cron: '23 0,1,9-23 * * *'
  workflow_dispatch:
    inputs:
      agendado:
        description: 'Rodada agendada (respeita o ritmo mínimo entre notícias). Usado pelo agendador da Vercel.'
        type: boolean
        default: false
      max:
        description: 'Máximo de notícias a publicar nesta rodada'
        type: number
        default: 1
      dry_run:
        description: 'Somente listar clusters (não chama a IA nem grava)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: caderno-hdl
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Coletar e publicar notícias
        env:
          # Gemini, plano gratuito (chave em https://aistudio.google.com/apikey)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CADERNO_MODELO: ${{ vars.CADERNO_MODELO }}
          CADERNO_MODELO_RESERVA: ${{ vars.CADERNO_MODELO_RESERVA }}
          MAX_NOTICIAS: ${{ inputs.max || 1 }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          CADERNO_AGENDADO: ${{ inputs.agendado && 'true' || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/caderno/coletar.mjs --max="$MAX_NOTICIAS" --dry-run
          else
            node scripts/caderno/coletar.mjs --max="$MAX_NOTICIAS"
          fi

      - name: Commit e push (apenas public/caderno)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/caderno
          if git diff --cached --quiet; then
            echo "Sem mudanças em public/caderno."
            exit 0
          fi
          git commit -m "chore(caderno): publica notícias de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') BRT"
          git pull --rebase origin main && git push || { sleep 5; git pull --rebase origin main && git push; }
